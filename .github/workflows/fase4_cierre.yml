name: Fase 4 - Cierre de resultados

# Local (UTC-5): reintenta cada 15 min entre las 23:00 y la 01:00
# (cruza medianoche).
on:
  schedule:
    - cron: "0,15,30,45 4-5 * * *"    # 04:00-05:59 UTC = 23:00-00:59 local
    - cron: "0 6 * * *"                # 06:00 UTC = 01:00 local (ultimo intento)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cerrar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Cerrar resultados del dia
        run: python cerrar_resultados.py

      - name: Guardar cambios en data/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --staged --quiet || git commit -m "Fase 4: cierre de resultados $(date -u +%Y-%m-%d)"
          git push
