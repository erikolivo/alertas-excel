name: Fase 3 - Vigilancia en vivo

# 4 disparos diarios de ~5.5h cada uno (330 min), con sleep interno de
# 5 min entre revisiones -- igual que la version anterior con
# API-Football. Los 4 disparos cubren casi todo el dia (quedan ~2h de
# hueco de madrugada local, franja de muy baja probabilidad de
# partidos en vivo).
#
# Horarios LOCALES (UTC-5) de arranque: 05:00, 10:30, 16:00, 21:30
# Convertidos a UTC (+5h):               10:00, 15:30, 21:00, 02:30
on:
  schedule:
    - cron: "0 10 * * *"
    - cron: "30 15 * * *"
    - cron: "0 21 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # 5.5h + margen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Vigilar en vivo durante ~5.5 horas (revision cada 5 min)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FIN=$(( $(date +%s) + 330*60 ))
          while [ "$(date +%s)" -lt "$FIN" ]; do
            python monitor.py || echo "[AVISO] Un ciclo de monitor.py fallo, se reintenta en el proximo."
            sleep 300
          done

      - name: Guardar cambios en data/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --staged --quiet || git commit -m "Fase 3: vigilancia en vivo $(date -u +%Y-%m-%dT%H:%M)"
          git push
